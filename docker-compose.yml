# zdmclock-clone 一键部署
# 用法：docker compose up -d --build
services:
  zdmclock:
    build: .
    image: zdmclock-clone:latest
    container_name: zdmclock
    restart: unless-stopped
    ports:
      # 默认仅绑定本机回环（127.0.0.1），避免镜像一启动就暴露在公网。
      # 如需对外提供服务，请改为 "3000:3000" 并务必先开启鉴权（REQUIRE_AUTH=true + 强密码）+ 反代保护。
      - "127.0.0.1:3000:3000"
    # 从宿主机 .env 注入配置（API_TOKEN / REQUIRE_AUTH / SMZDM_ADAPTER=cookie 等），
    # 不写死在 compose 中，真实配置可随 .env 生效。
    env_file:
      - .env
    # 强制生产环境，确保后端托管前端静态资源（覆盖 .env 中可能残留的 development）
    environment:
      - NODE_ENV=production
      - PORT=3000
    # 持久化签到数据（容器重建不丢）；命名卷与宿主机代码目录隔离，不会和本地开发数据混淆
    volumes:
      - zdmclock-data:/app/server/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  zdmclock-data:
