services:
  zdmclock:
    build: .
    container_name: zdmclock
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - SMZDM_ADAPTER=mock
      - REQUIRE_AUTH=false
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=admin123
    volumes:
      # 持久化本地 JSON 数据库，避免容器重建丢数据
      - ./server/data:/app/server/data
    restart: unless-stopped
